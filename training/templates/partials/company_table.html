<tr>
  <td data-label="Nome">{{ company.name }}</td>
  <td data-label="CNPJ">{{ company.cnpj }}</td>
  <td data-label="Ações">
    <div class="actions">
      <a href="{% url "company:company_page" company.id %}" class="view" title="Ver mais">
        <i class="fas fa-eye"></i>
      </a>
      <a href="{% url "company:delete_company" company.id %}" class="delete" title="Excluir">
        <i class="fas fa-trash"></i>
      </a>
    </div>
  </td>
</tr>
