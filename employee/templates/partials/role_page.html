{% for role in roles %}
  <tr>
    <td data-label="Nome">{{ role.name }}</td>
    <td data-label="Ações">
      <div class="actions">
        <a href="{% url 'employee:edit_role' role.id %}" class="edit" title="Editar">
          <i class="fas fa-edit"></i>
        </a>
        <a href="{% url 'employee:delete_role' role.id %}" class="delete" title="Excluir">
          <i class="fas fa-trash"></i>
        </a>
      </div>
    </td>
  </tr>
{% empty %}
  <tr>
    <td colspan="2" style="text-align:center; padding:2rem; color:var(--gray);">
      <i class="fas fa-briefcase" style="font-size: 2rem; display: block; margin-bottom: 0.5rem; opacity: 0.5;"></i>
      Nenhum cargo cadastrado.
    </td>
  </tr>
{% endfor %}
